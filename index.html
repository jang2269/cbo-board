y||"")+" · "+(l.type||"")+"</div></td>"+   "<td class=\"sub\">"+(l.contact||"")+"<br>"+(l.phone||"-")+"</td><td>"+(l.product||"")+"</td>"+   "<td class=\"num\">"+(l.price?(l.price/10000).toFixed(0)+"만":"-")+"</td>"+   "<td><select data-id=\""+l.id+"\">"+opts+"</select></td>"+   "<td class=\"num\">"+(l.prob||0)+"%</td><td class=\"sub\">"+(l.next||"")+"</td></tr>"; }).join(""); document.getElementById("tb").innerHTML=rows; var sels=document.querySelectorAll("#tb select");for(var i=0;i<sels.length;i++){sels[i].addEventListener("change",function(){var id=this.getAttribute("data-id");for(var j=0;j<leads.length;j++){if(leads[j].id===id){leads[j].stage=this.value;leads[j].updated_at=new Date().toISOString();}}save();render();});}}document.getElementById("exp").addEventListener("click",function(){var t=JSON.stringify({updated:new Date().toISOString(),leads:leads},null,1);if(navigator.clipboard)navigator.clipboard.writeText(t);msg("JSON 복사됨");});document.getElementById("up").textContent="2026-11-07 기준 · "+leads.length+"건";render();</script></body></html>
